name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Inputs and chrome-path output: https://github.com/browser-actions/setup-chrome/tree/v1
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          JOBFORGE_DOCKER: '1'
